; TCS2IoT configuration file.
;
; Values here are the defaults used by the application. Any of these keys can
; still be overridden at runtime by an environment variable of the same name
; (e.g. IOT_ENDPOINT), which keeps the Docker/compose workflow working.
;
; Point the app at a different file with the CONFIG_FILE environment variable.

[tcs2iot]
GIS_LAYER = TETRA

; File tailing / feed generation
; Daily-rotating logs: the processor scans WATCH_DIR for files matching
; FILE_PATTERN (e.g. DataLog_20260922.csv) and tails the newest one, switching
; to a new file automatically when the day rolls over.
WATCH_DIR = /data
FILE_PATTERN = DataLog_*.csv
; WATCH_FILE is only used by the legacy single-file follow(); kept for the
; generate_test_out.py feed and backward compatibility.
WATCH_FILE = /data/test-out.txt
#POLL_INTERVAL = 0.25
POLL_INTERVAL = 1
SOURCE_FILE = /data/captura-tcs-gps.txt
OUT_FILE = /data/test-out.txt
INTERVAL = 10.0

; AWS IoT Core endpoint (ATS). Leave empty to run the publisher in DRY-RUN mode.
; Get it with: aws iot describe-endpoint --endpoint-type iot:Data-ATS
#Sandbox
#IOT_ENDPOINT = a16lyef3f714lf-ats.iot.sa-east-1.amazonaws.com
#IOT_TOPIC = mdlr/test
#IOT_CLIENT_ID = mdlr_client2

#Prod
IOT_ENDPOINT = aqtuegvma3ss5-ats.iot.sa-east-1.amazonaws.com 
IOT_TOPIC = TETRA/things/terminals/uplink
IOT_CLIENT_ID = tetra_taira
IOT_QOS = 1

#Sandbox
#IOT_CERT_PATH = /certs/test/device.pem.crt
#IOT_KEY_PATH = /certs/test/private.pem.key
#Prod
IOT_CERT_PATH = /certs/40a36627348800801c6dc6130614665961f8ef2e667c1d1647ad2570c302571c-certificate.pem.crt
IOT_KEY_PATH = /certs/40a36627348800801c6dc6130614665961f8ef2e667c1d1647ad2570c302571c-private.pem.key
IOT_CA_PATH = /certs/AmazonRootCA.pem
